<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Meme Generator</h1>
    
    <form id="memeForm" class="form">
      <div class="form-group">
        <label for="topText">Top Text:</label>
        <input type="text" id="topText" placeholder="Enter top text" required>
      </div>
      
      <div class="form-group">
        <label for="bottomText">Bottom Text:</label>
        <input type="text" id="bottomText" placeholder="Enter bottom text" required>
      </div>
      
      <div class="form-group">
        <label for="imageUrl">Image URL:</label>
        <input type="url" id="imageUrl" placeholder="Enter image URL" required>
      </div>
      
      <button type="submit" class="submit-btn">Generate Meme</button>
    </form>

    <div id="memesContainer" class="memes-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
